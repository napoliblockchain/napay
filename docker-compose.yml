services:
  web:
    image: napay/napay:dev
    build:
      context: .
      dockerfile: docker/Dockerfile
    env_file:
      - ${NAPAY_ENV_FILE:-.env}
    ports:
      - "127.0.0.1:${NAPAY_HTTP_PORT:-18120}:80"
    volumes:
      - .:/var/www/html
    container_name: napay_backoffice
    network_mode: "bridge"
    extra_hosts:
      - "host.docker.internal:host-gateway"
