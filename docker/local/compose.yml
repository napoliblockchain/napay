services:
  web:
    ports: !reset []
    # HTTPS terminato da napay-gateway (orchestratore napay-project): https://napay.local
    networks: !override
      database: {}
      napay_local_browser:
        aliases: [napay-local-web]
    volumes:
      - .:/var/www/html:ro
      - ./docker/local/https.conf:/etc/apache2/conf-enabled/napay-local-https.conf:ro
      - local_runtime:/var/www/html/runtime
      - local_assets:/var/www/html/web/assets
    entrypoint:
      - sh
      - -ec
      - |
        install -d -o 33 -g 33 -m 0700 /var/www/html/runtime
        install -d -o 33 -g 33 -m 0755 /var/www/html/web/assets
        exec sh /var/www/html/docker/web-entrypoint.sh apache2-foreground
networks:
  # interna, creata da start-localhost.sh: solo web e napay-gateway, nessuna uscita Internet
  napay_local_browser:
    name: napay_local_browser
    external: true
volumes:
  local_runtime:
  local_assets:
